name: RECOVERY

on:
  workflow_dispatch:
    inputs:
      RECOVERY_URL:
        description: 'RECOVERY URL'
        required: true
        default: 'https://files.catbox.moe/(RECOMMENDED)'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out
        uses: actions/checkout@v4

      - name: Prepare the environment
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y file git wget lz4 tar openssl python3

      - name: Fetch image from URL
        run: |
          set -euo pipefail
          pwd
          wget -O recovery.img "${{ inputs.RECOVERY_URL }}"
          ls -lh recovery.img

      - name: Patch Process-1
        run: |
          set -euxo pipefail
          chmod +x script1.sh magiskboot
          ./script1.sh recovery.img

      - name: Patch Process-2
        run: |
          set -euxo pipefail
          chmod +x script2.sh
          ./script2.sh
          python3 avbtool extract_public_key --key phh.pem --output phh.pub.bin
          python3 avbtool add_hash_footer \
            --partition_name recovery \
            --partition_size "$(wc -c < recovery.img)" \
            --image recovery-patched.img \
            --key phh.pem \
            --algorithm SHA256_RSA4096
          mkdir -p output
          cp recovery-patched.img output/recovery.img
          (
            cd output
            tar cvf fastbootd-recovery.tar recovery.img
            md5sum -t fastbootd-recovery.tar >> fastbootd-recovery.tar
            mv fastbootd-recovery.tar fastbootd-recovery.tar.md5
          )
          ls -lh output/fastbootd-recovery.tar.md5

      - name: Read recovery metadata
        run: |
          set -euo pipefail
          cat recovery-info.env
          grep -v '^$' recovery-info.env >> "$GITHUB_ENV"

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: output/*.md5
          name: Patched-Recovery ${{ env.RECOVERY_MODEL }} ${{ env.RECOVERY_FIRMWARE }}
          body: |
            Patched recovery for **${{ env.RECOVERY_MODEL }}** (`${{ env.RECOVERY_DEVICE }}`)

            | Field | Value |
            | --- | --- |
            | Model | `${{ env.RECOVERY_MODEL }}` |
            | Device | `${{ env.RECOVERY_DEVICE }}` |
            | Firmware | `${{ env.RECOVERY_FIRMWARE }}` |
            | Android version | `${{ env.RECOVERY_ANDROID }}` |
            | Fingerprint | `${{ env.RECOVERY_FINGERPRINT }}` |

            Enabled in this image: fastbootd (fastboot in recovery) and root adb (`adb root` / root `adb shell`).

            ```
            ODIN AP Slot: fastbootd-recovery.tar.md5
            ODIN User Slot: vbmeta_disabled_r.tar
            ```
          tag_name: ${{ github.run_id }}
